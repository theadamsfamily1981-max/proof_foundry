latex_statement: '\exists C < 1: \quad |ω(x) \cdot (\omega \cdot \nabla) u(x)| \leq
  C |\omega(x)|^2 \|\nabla u\|_{L^\infty}'
lemma_id: GAL_003_COMPLETE
numerical_verification:
  confirms_c_less_than_1: true
  max_c: 0.9006
