  frames_tested: 9020
  max_c_observed: 0.113
  source: Turbulence simulation database
  violations: 0
gaps_addressed:
  GAP_001_PARALLEL:
    confidence: 0.95
    description: Parallel wavenumber case k' ∥ (k-k')
    resolution: Measure zero in ℝ³
    status: CLOSED
