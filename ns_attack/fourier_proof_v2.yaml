statement: 'For incompressible Navier-Stokes flow (∇·u = 0) with vorticity ω = ∇×u,
  the vorticity stretching alignment satisfies: |ω(x)·(ω·∇)u(x)| ≤ |ω(x)|² · ‖∇u‖_∞
  for all x where ω(x) ≠ 0.'
