assumptions:
- u ∈ L²(ℝ³) ∩ W^{1,∞}(ℝ³) (finite energy, bounded gradient)
- ∇·u = 0 (incompressible)
- Sufficient decay at infinity for Fourier transform
- No external forcing (or bounded forcing)
confidence: 0.65
core_insight: In Fourier space, incompressibility ∇·u = 0 becomes k·û(k) = 0 for all
  k. This means û(k) lies in the 2D plane perpendicular to k. Similarly, ω̂(k) = ik
  × û(k) also lies perpendicular to k. These orthogonality constraints prevent the
  vorticity stretching term from achieving perfect alignment, bounding the geometric
  factor C < 1.
definitions:
  S: Strain tensor S = (∇u + ∇uᵀ)/2
  alignment: Alignment factor cos(θ) where θ is angle between ω and (ω·∇)u
  omega: Vorticity ω = ∇ × u = curl(u)
  omega_hat: ω̂(k) = ik × û(k) (Fourier of curl)
  stretching: Vorticity stretching term (ω·∇)u
  u: 'Velocity field, u: ℝ³ → ℝ³'
  u_hat: Fourier transform û(k) = ∫ u(x)e^{-ik·x} dx
latex_statement: '|ω(x) \cdot (\omega \cdot \nabla) u(x)| \leq |\omega(x)|^2 \cdot
  \|\nabla u\|_{L^\infty}'
lemma_id: GAL_002_FOURIER
orthogonality_uses:
- k·û(k) = 0 (incompressibility in Fourier space)
- k·ω̂(k) = 0 (curl is perpendicular to wavenumber)
- ω̂ and stretching term constrained to mutually oblique planes
- Integration averages alignment below maximum
potential_gaps:
- 'Step 5-6: Need rigorous computation of θ_max geometric factor'
- 'Step 6: Handle parallel wavenumber case (k'' ∥ k-k'')'
- 'Step 8: Pointwise vs L² bound transition needs more rigor'
- Need to show C < 1 emerges naturally, not just C finite
- Boundary of integration domain in convolution needs care
